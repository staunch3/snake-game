<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121826;
    --line: #1e2637;
    --text: #e6ebf5;
    --muted: #8b96ab;
    --accent: #4ade80;
    --board: #0e1116;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: radial-gradient(circle at 50% 0%, #16203a 0%, var(--bg) 62%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }
  .wrap { width: 100%; max-width: 560px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .04em; }
  h1 small {
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .scores { display: flex; gap: 20px; }
  .score { text-align: right; }
  .score span {
    display: block;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .score strong { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  #best { color: var(--accent); }

  .board {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: var(--board);
    box-shadow: 0 24px 60px -24px #000;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    text-align: center;
    background: rgba(8, 11, 18, .82);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: opacity .18s ease;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; font-weight: 700; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .overlay button {
    margin-top: 8px;
    padding: 11px 28px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #05230f;
    font: 700 15px/1 inherit;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .overlay button:hover { filter: brightness(1.08); }
  .overlay button:active { transform: scale(.96); }

  .hint {
    margin: 14px 0 0;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 2;
  }
  kbd {
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>贪吃蛇 <small>Snake</small></h1>
    <div class="scores">
      <div class="score"><span>得分</span><strong id="score">0</strong></div>
      <div class="score"><span>最高</span><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="board" id="board">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <button id="ovBtn" type="button"></button>
    </div>
  </div>

  <p class="hint">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
    <kbd>空格</kbd> 暂停 · 手机滑动屏幕
  </p>
</div>

<script>
(() => {
  'use strict';

  const COLS = 20, ROWS = 20, CELL = 30;
  const W = COLS * CELL, H = ROWS * CELL;

  const BASE_SPEED = 150;
  const MIN_SPEED = 70;
  const SPEED_STEP = 3;
  const MAX_QUEUE = 3;

  const BG = '#0e1116';
  const GRID = 'rgba(255,255,255,.035)';
  const HEAD_RGB = [74, 222, 128];
  const TAIL_RGB = [13, 148, 136];
  const DEAD_RGB = [248, 113, 113];

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const board = document.getElementById('board');
  const elScore = document.getElementById('score');
  const elBest = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovBtn = document.getElementById('ovBtn');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let snake, prev, dir, queue, food, score, best, speed, acc, last, state;

  function loadBest() {
    try { return Number(localStorage.getItem('snake.best')) || 0; } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('snake.best', String(v)); } catch { /* 隐私模式等场景忽略 */ }
  }

  function syncPrev() {
    prev = snake.map(s => ({ x: s.x, y: s.y }));
  }

  function reset() {
    const cy = Math.floor(ROWS / 2);
    snake = [{ x: 4, y: cy }, { x: 3, y: cy }, { x: 2, y: cy }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    speed = BASE_SPEED;
    acc = 0;
    last = null;
    food = null;
    syncPrev();
    placeFood();
    elScore.textContent = '0';
    setState('ready');
  }

  function placeFood() {
    const taken = new Set(snake.map(s => s.y * COLS + s.x));
    const free = [];
    for (let i = 0; i < COLS * ROWS; i++) if (!taken.has(i)) free.push(i);
    if (!free.length) { win(); return; }
    const idx = free[(Math.random() * free.length) | 0];
    food = { x: idx % COLS, y: (idx / COLS) | 0 };
  }

  function setState(next) {
    state = next;
    if (next === 'ready') showOverlay('准备开始', '吃到食物就长大，撞墙或撞到自己就结束。', '开始游戏');
    else if (next === 'paused') showOverlay('已暂停', '随时回来继续。', '继续');
    else if (next === 'over') showOverlay('游戏结束', '本局得分 ' + score + ' · 历史最高 ' + best, '再来一局');
    else hideOverlay();
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btn;
    overlay.hidden = false;
  }
  function hideOverlay() {
    overlay.hidden = true;
  }

  function start() {
    if (state !== 'ready') return;
    state = 'playing';
    acc = 0;
    last = null;
    hideOverlay();
  }

  function pause() {
    if (state !== 'playing') return;
    acc = 0;
    syncPrev();
    setState('paused');
  }

  function primary() {
    if (state === 'ready') start();
    else if (state === 'playing') pause();
    else if (state === 'paused') { state = 'playing'; last = null; hideOverlay(); }
    else { reset(); start(); }
  }

  function die() {
    acc = 0;
    syncPrev();
    setState('over');
  }

  function win() {
    acc = 0;
    syncPrev();
    state = 'over';
    showOverlay('通关！', '整个屏幕都是蛇，得分 ' + score + '。', '再来一局');
  }

  function step() {
    if (queue.length) {
      const nd = queue.shift();
      if (nd.x !== -dir.x || nd.y !== -dir.y) dir = nd;
    }

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { die(); return; }

    const grow = head.x === food.x && head.y === food.y;
    const body = grow ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) { die(); return; }

    syncPrev();
    snake.unshift(head);

    if (grow) {
      score += 10;
      elScore.textContent = score;
      if (score > best) { best = score; saveBest(best); elBest.textContent = best; }
      speed = Math.max(MIN_SPEED, BASE_SPEED - (snake.length - 3) * SPEED_STEP);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function enqueue(x, y) {
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (x === -ref.x && y === -ref.y) return;
    if (x === ref.x && y === ref.y) return;
    if (queue.length < MAX_QUEUE) queue.push({ x, y });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function mix(a, b, k) {
    const u = k < 0 ? 0 : k > 1 ? 1 : k;
    return [
      Math.round(a[0] + (b[0] - a[0]) * u),
      Math.round(a[1] + (b[1] - a[1]) * u),
      Math.round(a[2] + (b[2] - a[2]) * u),
    ];
  }

  function draw() {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) {
      ctx.moveTo(x * CELL + .5, 0);
      ctx.lineTo(x * CELL + .5, H);
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.moveTo(0, y * CELL + .5);
      ctx.lineTo(W, y * CELL + .5);
    }
    ctx.stroke();

    const t = state === 'playing' ? Math.min(acc / speed, 1) : 0;

    if (food) {
      const beat = state === 'playing' ? 1 + Math.sin(performance.now() / 220) * .06 : 1;
      const cx = (food.x + .5) * CELL;
      const cy = (food.y + .5) * CELL;
      const r = CELL * .3 * beat;

      ctx.fillStyle = 'rgba(248,113,113,.16)';
      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,.62)';
      ctx.beginPath();
      ctx.arc(cx - r * .3, cy - r * .34, r * .24, 0, Math.PI * 2);
      ctx.fill();
    }

    const dead = state === 'over';
    const n = snake.length;

    for (let i = n - 1; i >= 0; i--) {
      const to = snake[i];
      const from = prev[i] || to;
      const x = (from.x + (to.x - from.x) * t) * CELL;
      const y = (from.y + (to.y - from.y) * t) * CELL;

      const rgb = dead
        ? mix(DEAD_RGB, [90, 30, 40], n === 1 ? 0 : i / (n - 1))
        : mix(HEAD_RGB, TAIL_RGB, n === 1 ? 0 : i / (n - 1));
      ctx.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';

      roundRect(x + 2, y + 2, CELL - 4, CELL - 4, i === 0 ? 9 : 7);
      ctx.fill();
    }

    if (!dead && n) drawEyes(t);
  }

  function drawEyes(t) {
    const to = snake[0];
    const from = prev[0] || to;
    const cx = (from.x + (to.x - from.x) * t + .5) * CELL;
    const cy = (from.y + (to.y - from.y) * t + .5) * CELL;

    const px = -dir.y, py = dir.x;
    const ahead = CELL * .16;
    const side = CELL * .17;

    ctx.fillStyle = '#08130c';
    for (const s of [1, -1]) {
      ctx.beginPath();
      ctx.arc(cx + dir.x * ahead + px * side * s, cy + dir.y * ahead + py * side * s, CELL * .085, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function frame(now) {
    if (last === null) last = now;
    let dt = now - last;
    last = now;
    if (dt > 200) dt = 200;

    if (state === 'playing') {
      acc += dt;
      while (acc >= speed && state === 'playing') {
        acc -= speed;
        step();
      }
    }

    draw();
    requestAnimationFrame(frame);
  }

  const KEYS = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  };

  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();

    if (k === ' ' || k === 'spacebar' || k === 'enter') {
      e.preventDefault();
      primary();
      return;
    }

    const d = KEYS[k];
    if (!d) return;
    e.preventDefault();

    if (state === 'ready') {
      start();
      enqueue(d[0], d[1]);
    } else if (state === 'playing') {
      enqueue(d[0], d[1]);
    }
  });

  ovBtn.addEventListener('click', primary);

  board.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    if (state === 'ready' || state === 'over') primary();
  });

  let touchFrom = null;
  board.addEventListener('touchstart', e => {
    const tp = e.changedTouches[0];
    touchFrom = { x: tp.clientX, y: tp.clientY };
  }, { passive: true });

  board.addEventListener('touchend', e => {
    if (!touchFrom) return;
    if (e.target.closest('button')) { touchFrom = null; return; }

    const tp = e.changedTouches[0];
    const dx = tp.clientX - touchFrom.x;
    const dy = tp.clientY - touchFrom.y;
    touchFrom = null;

    if (Math.hypot(dx, dy) < 24) {
      if (state !== 'playing') primary();
      return;
    }

    if (state === 'ready') start();
    if (state !== 'playing') return;

    if (Math.abs(dx) > Math.abs(dy)) enqueue(dx > 0 ? 1 : -1, 0);
    else enqueue(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') pause();
  });

  best = loadBest();
  elBest.textContent = best;
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
